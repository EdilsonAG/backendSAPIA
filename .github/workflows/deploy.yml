name: Deploy

on:
  push:
    branches: [master]

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Java
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Buildando java
        run: mvn clean package -DskipTests

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            edialgon/backendcontroller:latest
            edialgon/backendcontroller:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Deploy na OCI via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            docker pull edialgon/backendcontroller:latest
            docker stop backendcontroller || true
            docker rm backendcontroller || true
            docker run -d \
              --name backendcontroller \
              --restart unless-stopped \
              -p 8080:8080 \
              edialgon/backendcontroller:latest